<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1b1b54">
    <title>Sin conexión — Achrono</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
             font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;text-align:center;
             background:radial-gradient(50rem 30rem at 85% -10%,rgba(47,198,165,.2),transparent 60%),#070719}
        main{max-width:26rem}
        img{width:84px;height:84px;border-radius:20px;margin-bottom:24px}
        h1{font-size:1.6rem;margin:0 0 .75rem}
        p{margin:0 0 1.5rem;color:rgba(255,255,255,.75);line-height:1.55}
        button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:.8rem 1.6rem;background:#2fc6a5;color:#1b1b54;cursor:pointer}
    </style>
</head>
<body>
    <main>
        <img src="/images/icon-192.png" alt="Achrono">
        <h1>Sin conexión</h1>
        <p>Achrono necesita internet para fichar y consultar tus datos. Comprueba tu conexión y vuelve a intentarlo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
